[env]
TERM = "xterm-256color"

# [window]
# # Allow terminal applications to change Alacritty's window title
# # for example `printf "\e]2;Your Title\007"`
# # <https://github.com/alacritty/alacritty/issues/3588#issuecomment-613189338>.
# dynamic_title = true

# Font configuration (changes require restart).
[font]
# Point size of the font
size = 19.0

# The normal (roman) font face to use.
# Style can be specified to pick a specific face.
[font.normal]
family = "Monospace"

# The bold font face
[font.bold]
family = "Monospace"

# The italic font face
[font.italic]
family = "Monospace"

[cursor]
# Cursor blinking interval in milliseconds.
blink_interval = 110

[cursor.style]
blinking = "Always"

[mouse]
# Hiding mouse cursor while typing
# <https://github.com/alacritty/alacritty/issues/2618>.
hide_when_typing = true

[[hints.enabled]]
# binding = { key = "U", mods = "Control|Shift" }
command = "gnome-open" # "xdg-open" # "kde-open" # On Linux/BSD. # "open" # On macOS. # { program = "cmd", args = [ "/c", "start", "" ] } # On Windowsu
hyperlinks = true
post_processing = true
persist = false
mouse.enabled = true
regex = "(ipfs:|ipns:|magnet:|mailto:|gemini://|gopher://|https://|http://|news:|file:|git://|ssh:|ftp://)[^\u0000-\u001F\u007F-\u009F<>\"\\s{-}\\^⟨⟩`·$⌑]+"

[selection]
# When set to `true`, selected text will be copied to the primary clipboard.
save_to_clipboard = false
# This string contains all characters that are used as separators for
# "semantic words" in Alacritty.
semantic_escape_chars = ",│`|:;\"' ()[]{}<>\t·⌑"

# NOTE: The `chars` of `key_bindings` sends a byte sequence to the running application.
# The `chars` field writes the specified string to the terminal. This makes
# it possible to pass escape sequences. To find escape codes for bindings
# like `PageUp` (`"\x1b[5~"`), you can run the command `showkey -a` outside
# of tmux <https://bestasciitable.com>. Note that applications use terminfo
# to map escape sequences back to keys. It is therefore required to update
# the terminfo when changing an escape sequence.

# # vi mode <https://github.com/alacritty/alacritty/blob/master/docs/features.md#vi-mode>.
# [[keyboard.bindings]]
# action = "None"
# key = "Space"
# mods = "Control|Shift"

[[keyboard.bindings]]
chars = "\u0013"
key = "Space"
mods = "Super"

# [[keyboard.bindings]]
# chars = "\eS"
# key = "Space"
# mods = "Super|Shift"

