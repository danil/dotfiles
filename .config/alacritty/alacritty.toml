# Shortcuts for Tmux. The leader key is Control-b (0x02).

# Close tab (kill).
[[keyboard.bindings]]
chars = "\u0002&"
key = "W"
mods = "Command"

# New tab.
[[keyboard.bindings]]
chars = "\u0002c"
key = "T"
mods = "Command"

# Select next tab.
[[keyboard.bindings]]
chars = "\u0002n"
key = "RBracket"
mods = "Command|Shift"

# Select previous tab.
[[keyboard.bindings]]
chars = "\u0002p"
key = "LBracket"
mods = "Command|Shift"

# Select next pane.
[[keyboard.bindings]]
chars = "\u0002o"
key = "RBracket"
mods = "Command"

# Select last (previously used) pane.
[[keyboard.bindings]]
chars = "\u0002;"
key = "LBracket"
mods = "Command"

# Search (upwards) (see tmux.conf).
[[keyboard.bindings]]
chars = "\u0002/"
key = "F"
mods = "Command"

# Russian Cyrillic.

# Send Control-g.
[[keyboard.bindings]]
chars = "\x07"
key = "п"
mods = "Control"

# Send Control-k.
[[keyboard.bindings]]
chars = "\u000b"
key = "л"
mods = "Control"

# Send Control-h.
[[keyboard.bindings]]
chars = "\u007F"
