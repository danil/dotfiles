modmap:
  - name: Swapping Alt and Control keys <https://github.com/xremap/xremap/issues/445#issue-2204409094>, <https://github.com/xremap/xremap/issues/37#issuecomment-1001074006>.
    remap:
      LeftCtrl: LeftAlt
      LeftAlt:  LeftCtrl
      RightCtrl: RightAlt
      RightAlt:  RightCtrl

  - remap:
     CapsLock: Esc

keymap:
  - name: Escape.
    remap:
      C-t:
        remap:
          C-t: { escape_next_key: true }

  - name: Common keybindings.
    remap:
      C-t:
        remap:
          KEY_C:
            launch: ["sudo", "-u", "danil", "-i", "/bin/sh", "-c", ". ~/.shrc && alacritty"]
          KEY_G:
            launch: ["bash", "-c", "dbus-send --session --type=method_call --dest=org.freedesktop.Notifications /org/freedesktop/Notifications org.xfce.Notifyd.Quit"]
          Shift-1:
            launch: ["sudo", "-u", "danil", "-i", "/bin/sh", "-c", ". ~/.shrc && albert show"]
          KEY_U:
            remap:
              KEY_C:
                launch: ["sudo", "-u", "danil", "-i", "/bin/sh", "-c", ". ~/.shrc && wezterm"]
              Shift-1:
                launch: ["sudo", "-u", "danil", "-i", "/bin/sh", "-c", ". ~/.shrc && krunner"]

  - name: Invert colors on xorg/xrandr.
    remap:
      C-t:
        remap:
          KEY_I:
            launch: ["sudo", "-u", "danil", "-i", "/bin/sh", "-c", ". ~/.shrc && qdbus org.kde.kglobalaccel /component/kwin org.kde.kglobalaccel.Component.invokeShortcut 'Invert'"]

  - name: Lock or lock and sleep/suspend or dim screen backlight <https://askubuntu.com/questions/1233858/xubuntu-20-04-suspend-waits-30-seconds>.
    remap:
      C-t:
        remap:
          KEY_L:
            launch: ["sudo", "-u", "danil", "-i", "/bin/sh", "-c", ". ~/.shrc && sleep 0.1 && dbus-send --session --type=method_call --dest=org.kde.kglobalaccel  /component/org_kde_powerdevil org.kde.kglobalaccel.Component.invokeShortcut string:'Turn Off Screen'"]
          KEY_U:
            remap:
              KEY_L:
                launch: ["xflock4"]
              KEY_U:
                remap:
                  KEY_L:
                    launch: ["xfce4-session-logout --suspend && xfce4-screensaver"]

  - name: Sleep/suspend or dim screen backlight.
    remap:
      C-t:
        remap:
          KEY_S:
            launch: ["sudo", "-u", "danil", "-i", "/bin/sh", "-c", ". ~/.shrc && sleep 0.1 && dbus-send --session --type=method_call --dest=org.kde.kglobalaccel  /component/org_kde_powerdevil org.kde.kglobalaccel.Component.invokeShortcut string:'Turn Off Screen'"]
          KEY_U:
            remap:
              KEY_S:
                launch: ["sudo", "-u", "danil", "-i", "/bin/sh", "-c", ". ~/.shrc && sleep 0.1 && dbus-send --session --type=method_call --dest=org.kde.kglobalaccel  /component/org_kde_powerdevil org.kde.kglobalaccel.Component.invokeShortcut string:'Turn Off Screen'"]
              KEY_U:
                remap:
                  KEY_S:
                    launch: ["xfce4-session-logout --suspend"]

  - name: Find cursor a-la "shake to find Cursor" <https://github.com/arp242/find-cursor>.
    remap:
      C-t:
        remap:
          KEY_C:
            launch: ["sudo", "-u", "danil", "-i", "/bin/sh", "-c", ". ~/.shrc && find-cursor --color=#ff0000 --size=700 --line-width=10 --distance=70"]

  - name: Media Player control.
    remap:
      C-t:
        remap:
          KEY_M:
            remap:
              KEY_H:
                launch: ["sudo", "-u", "danil", "-i", "/bin/sh", "-c", ". ~/.shrc && mediactl Previous"]
              KEY_J:
                launch: ["sudo", "-u", "danil", "-i", "/bin/sh", "-c", ". ~/.shrc && mediactl Play"]
              KEY_K:
                launch: ["sudo", "-u", "danil", "-i", "/bin/sh", "-c", ". ~/.shrc && mediactl Pause"]
              KEY_L:
                launch: ["sudo", "-u", "danil", "-i", "/bin/sh", "-c", ". ~/.shrc && mediactl Next"]

  - name: Screen shot.
    remap:
      C-t:
        remap:
          KEY_P:
            remap:
              KEY_P:
                launch: ["sudo", "-u", "danil", "-i", "/bin/sh", "-c", ". ~/.shrc && maim ~/Pictures/Screenshots/screenshot-$(date +%Y%m%d%H%M%S).png"]
              KEY_S:
                launch: ["sudo", "-u", "danil", "-i", "/bin/sh", "-c", ". ~/.shrc && maim --select ~/Pictures/Screenshots/screenshot-$(date +%Y%m%d%H%M%S).png"]

  - name: ExposeAll a-la compiz scale/gnome overview/osx expose/skippy-xd.
    remap:
      C-t:
        remap:
          KEY_W:
            remap:
              KEY_W:
                launch: ["sudo", "-u", "danil", "-i", "/bin/sh", "-c", ". ~/.shrc && qdbus org.kde.kglobalaccel /component/kwin org.kde.kglobalaccel.Component.invokeShortcut 'ExposeAll'"]
              KEY_E:
                remap:
                  KEY_E:
                    launch: ["sudo", "-u", "danil", "-i", "/bin/sh", "-c", ". ~/.shrc && qdbus org.kde.kglobalaccel /component/kwin org.kde.kglobalaccel.Component.invokeShortcut 'Expose'"]
                  KEY_C:
                    launch: ["sudo", "-u", "danil", "-i", "/bin/sh", "-c", ". ~/.shrc && qdbus org.kde.kglobalaccel /component/kwin org.kde.kglobalaccel.Component.invokeShortcut 'ExposeClass'"]
                  KEY_D:
                    launch: ["sudo", "-u", "danil", "-i", "/bin/sh", "-c", ". ~/.shrc && qdbus org.kde.kglobalaccel /component/kwin org.kde.kglobalaccel.Component.invokeShortcut 'ExposeClassCurrentdesktop'"]

  - name: Window manager.
    remap:
      C-t:
        remap:
          KEY_W:
            remap:
              KEY_C:
                launch: ["sudo", "-u", "danil", "-i", "/bin/sh", "-c", ". ~/.shrc && qdbus org.kde.kglobalaccel /component/kwin org.kde.kglobalaccel.Component.invokeShortcut 'Window Close'"]
              KEY_F:
                launch: ["sudo", "-u", "danil", "-i", "/bin/sh", "-c", ". ~/.shrc && qdbus org.kde.kglobalaccel /component/kwin org.kde.kglobalaccel.Component.invokeShortcut 'Window Fullscreen'"]
              KEY_M:
                launch: ["sudo", "-u", "danil", "-i", "/bin/sh", "-c", ". ~/.shrc && qdbus org.kde.kglobalaccel /component/kwin org.kde.kglobalaccel.Component.invokeShortcut 'Window Maximize'"]

  - name: Show desktop <http://ubuntuforums.org/showthread.php?t=1615199#td_post_10083165>.
    remap:
      C-t:
        remap:
          KEY_D: { launch: ["sudo", "-u", "danil", "-i", "/bin/sh", "-c", ". ~/.shrc && qdbus org.kde.kglobalaccel /component/kwin org.kde.kglobalaccel.Component.invokeShortcut 'Show Desktop'"] }

  - name: KDE Plasma workspace.
    remap:
      C-t:
        remap:
          KEY_1: { launch: ["sudo", "-u", "danil", "-i", "/bin/sh", "-c", ". ~/.shrc && qdbus org.kde.kglobalaccel /component/kwin org.kde.kglobalaccel.Component.invokeShortcut 'Switch to Desktop 1'"] }
          KEY_2: { launch: ["sudo", "-u", "danil", "-i", "/bin/sh", "-c", ". ~/.shrc && qdbus org.kde.kglobalaccel /component/kwin org.kde.kglobalaccel.Component.invokeShortcut 'Switch to Desktop 2'"] }
          KEY_3: { launch: ["sudo", "-u", "danil", "-i", "/bin/sh", "-c", ". ~/.shrc && qdbus org.kde.kglobalaccel /component/kwin org.kde.kglobalaccel.Component.invokeShortcut 'Switch to Desktop 3'"] }
          KEY_4: { launch: ["sudo", "-u", "danil", "-i", "/bin/sh", "-c", ". ~/.shrc && qdbus org.kde.kglobalaccel /component/kwin org.kde.kglobalaccel.Component.invokeShortcut 'Switch to Desktop 4'"] }
          KEY_5: { launch: ["sudo", "-u", "danil", "-i", "/bin/sh", "-c", ". ~/.shrc && qdbus org.kde.kglobalaccel /component/kwin org.kde.kglobalaccel.Component.invokeShortcut 'Switch to Desktop 5'"] }
          KEY_6: { launch: ["sudo", "-u", "danil", "-i", "/bin/sh", "-c", ". ~/.shrc && qdbus org.kde.kglobalaccel /component/kwin org.kde.kglobalaccel.Component.invokeShortcut 'Switch to Desktop 6'"] }
          KEY_7: { launch: ["sudo", "-u", "danil", "-i", "/bin/sh", "-c", ". ~/.shrc && qdbus org.kde.kglobalaccel /component/kwin org.kde.kglobalaccel.Component.invokeShortcut 'Switch to Desktop 7'"] }
          KEY_8: { launch: ["sudo", "-u", "danil", "-i", "/bin/sh", "-c", ". ~/.shrc && qdbus org.kde.kglobalaccel /component/kwin org.kde.kglobalaccel.Component.invokeShortcut 'Switch to Desktop 8'"] }
          KEY_9: { launch: ["sudo", "-u", "danil", "-i", "/bin/sh", "-c", ". ~/.shrc && qdbus org.kde.kglobalaccel /component/kwin org.kde.kglobalaccel.Component.invokeShortcut 'Switch to Desktop 9'"] }

  - name: KDE Plasma move window to workspace.
    remap:
      C-t:
        remap:
          KEY_W:
            remap:
              KEY_1: { launch: ["sudo", "-u", "danil", "-i", "/bin/sh", "-c", ". ~/.shrc && qdbus org.kde.kglobalaccel /component/kwin org.kde.kglobalaccel.Component.invokeShortcut 'Window to Desktop 1'"] }
              KEY_2: { launch: ["sudo", "-u", "danil", "-i", "/bin/sh", "-c", ". ~/.shrc && qdbus org.kde.kglobalaccel /component/kwin org.kde.kglobalaccel.Component.invokeShortcut 'Window to Desktop 2'"] }
              KEY_3: { launch: ["sudo", "-u", "danil", "-i", "/bin/sh", "-c", ". ~/.shrc && qdbus org.kde.kglobalaccel /component/kwin org.kde.kglobalaccel.Component.invokeShortcut 'Window to Desktop 3'"] }
              KEY_4: { launch: ["sudo", "-u", "danil", "-i", "/bin/sh", "-c", ". ~/.shrc && qdbus org.kde.kglobalaccel /component/kwin org.kde.kglobalaccel.Component.invokeShortcut 'Window to Desktop 4'"] }
              KEY_5: { launch: ["sudo", "-u", "danil", "-i", "/bin/sh", "-c", ". ~/.shrc && qdbus org.kde.kglobalaccel /component/kwin org.kde.kglobalaccel.Component.invokeShortcut 'Window to Desktop 5'"] }
              KEY_6: { launch: ["sudo", "-u", "danil", "-i", "/bin/sh", "-c", ". ~/.shrc && qdbus org.kde.kglobalaccel /component/kwin org.kde.kglobalaccel.Component.invokeShortcut 'Window to Desktop 6'"] }
              KEY_7: { launch: ["sudo", "-u", "danil", "-i", "/bin/sh", "-c", ". ~/.shrc && qdbus org.kde.kglobalaccel /component/kwin org.kde.kglobalaccel.Component.invokeShortcut 'Window to Desktop 7'"] }
              KEY_8: { launch: ["sudo", "-u", "danil", "-i", "/bin/sh", "-c", ". ~/.shrc && qdbus org.kde.kglobalaccel /component/kwin org.kde.kglobalaccel.Component.invokeShortcut 'Window to Desktop 8'"] }
              KEY_9: { launch: ["sudo", "-u", "danil", "-i", "/bin/sh", "-c", ". ~/.shrc && qdbus org.kde.kglobalaccel /component/kwin org.kde.kglobalaccel.Component.invokeShortcut 'Window to Desktop 9'"] }
