modmap:
  - name: Swapping Alt and Control keys <https://github.com/xremap/xremap/issues/445#issue-2204409094>, <https://github.com/xremap/xremap/issues/37#issuecomment-1001074006>.
    remap:
      LeftCtrl: LeftAlt
      LeftAlt:  LeftCtrl
      RightCtrl: RightAlt
      RightAlt:  RightCtrl

  # - remap:
  #    CapsLock: Shift_R

keymap:
  - name: Escape.
    remap:
      Ctrl-t:
        remap:
          Ctrl-t: { escape_next_key: true }

  - name: Layout toggle and language toggle.
    remap:
      CapsLock:
        launch: ["sudo", "-u", "danil", "-i", "/bin/sh", "-c", ". ~/.shrc && layout_toggle_gnome50.sh"]

  - name: Common keybindings.
    remap:
      Ctrl-t:
        remap:
          KEY_C:
            launch: ["sudo", "-u", "danil", "-i", "/bin/sh", "-c", ". ~/.shrc && alacritty"]
          KEY_G:
            launch: ["bash", "-c", "dbus-send --session --type=method_call --dest=org.freedesktop.Notifications /org/freedesktop/Notifications org.xfce.Notifyd.Quit"]
          Shift-1:
            launch: ["sudo", "-u", "danil", "-i", "/bin/sh", "-c", ". ~/.shrc && krunner"]
          KEY_U:
            remap:
              KEY_C:
                launch: ["sudo", "-u", "danil", "-i", "/bin/sh", "-c", ". ~/.shrc && ghostty"]
              Shift-1:
                launch: ["sudo", "-u", "danil", "-i", "/bin/sh", "-c", ". ~/.shrc && albert show"]
            KEY_U:
              remap:
                Shift-1:
                  launch: ["sudo", "-u", "danil", "-i", "/bin/sh", "-c", ". ~/.shrc && qdbus org.kde.kglobalaccel /kickoff"]

  - name: Invert colors on xorg/xrandr.
    remap:
      Ctrl-t:
        remap:
          KEY_I:
            launch: ["sudo", "-u", "danil", "-i", "/bin/sh", "-c", ". ~/.shrc && qdbus org.kde.kglobalaccel /component/kwin org.kde.kglobalaccel.Component.invokeShortcut 'Invert'"]

  - name: Lock or lock and sleep/suspend or dim screen backlight <https://askubuntu.com/questions/1233858/xubuntu-20-04-suspend-waits-30-seconds>.
    remap:
      Ctrl-t:
        remap:
          KEY_L:
            launch: ["sudo", "-u", "danil", "-i", "/bin/sh", "-c", ". ~/.shrc && sleep 0.1 && screen-backlight-off-gnome"]
          KEY_U:
            remap:
              KEY_L:
                launch: ["sudo", "-u", "danil", "-i", "/bin/sh", "-c", ". ~/.shrc && sleep 0.1 && screen-lock-gnome"]
              KEY_U:
                remap:
                  KEY_L:
                    launch: ["sudo", "-u", "danil", "-i", "/bin/sh", "-c", ". ~/.shrc && sleep 0.1 && sudo systemctl suspend"]

  - name: Sleep/suspend or dim screen backlight.
    remap:
      Ctrl-t:
        remap:
          KEY_S:
            launch: ["sudo", "-u", "danil", "-i", "/bin/sh", "-c", ". ~/.shrc && sleep 0.1 && screen-backlight-off-gnome"]
          KEY_U:
            remap:
              KEY_S:
                launch: ["sudo", "-u", "danil", "-i", "/bin/sh", "-c", ". ~/.shrc && sleep 0.1 && screen-backlight-off-gnome"]
              KEY_U:
                remap:
                  KEY_S:
                    launch: ["sudo", "-u", "danil", "-i", "/bin/sh", "-c", ". ~/.shrc && sleep 0.1 && sudo systemctl suspend"]

  - name: Find cursor a-la "shake to find Cursor" <https://github.com/arp242/find-cursor>.
    remap:
      Ctrl-t:
        remap:
          KEY_C:
            launch: ["sudo", "-u", "danil", "-i", "/bin/sh", "-c", ". ~/.shrc && find-cursor --color=#ff0000 --size=700 --line-width=10 --distance=70"]

  - name: Screen backlight control.
    remap:
      C-F5:
        launch: ["sudo", "-u", "danil", "-i", "/bin/sh", "-c", ". ~/.shrc && screen-backlight-down"]
      C-F6:
        launch: ["sudo", "-u", "danil", "-i", "/bin/sh", "-c", ". ~/.shrc && screen-backlight-up"]
      Ctrl-t:
        remap:
          KEY_B:
            remap:
              KEY_J:
                launch: ["sudo", "-u", "danil", "-i", "/bin/sh", "-c", ". ~/.shrc && screen-backlight-down"]
              KEY_K:
                launch: ["sudo", "-u", "danil", "-i", "/bin/sh", "-c", ". ~/.shrc && screen-backlight-up"]

  - name: Sound volume (PulseAudio) control.
    remap:
      C-F2:
        launch: ["sudo", "-u", "danil", "-i", "/bin/sh", "-c", ". ~/.shrc && audio-sound-volume-down"]
      C-F3:
        launch: ["sudo", "-u", "danil", "-i", "/bin/sh", "-c", ". ~/.shrc && audio-sound-volume-up"]
      Ctrl-t:
        remap:
          KEY_V:
            remap:
              KEY_J:
                launch: ["sudo", "-u", "danil", "-i", "/bin/sh", "-c", ". ~/.shrc && audio-sound-volume-down"]
              KEY_K:
                launch: ["sudo", "-u", "danil", "-i", "/bin/sh", "-c", ". ~/.shrc && audio-sound-volume-up"]

  - name: Music Media Player control.
    remap:
      Ctrl-t:
        remap:
          KEY_M:
            remap:
              KEY_H:
                launch: ["sudo", "-u", "danil", "-i", "/bin/sh", "-c", ". ~/.shrc && mediactl Previous"]
              KEY_J:
                launch: ["sudo", "-u", "danil", "-i", "/bin/sh", "-c", ". ~/.shrc && mediactl Play"]
              KEY_K:
                launch: ["sudo", "-u", "danil", "-i", "/bin/sh", "-c", ". ~/.shrc && mediactl Pause"]
              KEY_L:
                launch: ["sudo", "-u", "danil", "-i", "/bin/sh", "-c", ". ~/.shrc && mediactl Next"]

  - name: Screen shot.
    remap:
      Ctrl-t:
        remap:
          KEY_P:
            remap:
              KEY_P:
                launch: ["sudo", "-u", "danil", "-i", "/bin/sh", "-c", ". ~/.shrc && maim ~/Pictures/Screenshots/screenshot-$(date +%Y%m%d%H%M%S).png"]
              KEY_S:
                launch: ["sudo", "-u", "danil", "-i", "/bin/sh", "-c", ". ~/.shrc && maim --select ~/Pictures/Screenshots/screenshot-$(date +%Y%m%d%H%M%S).png"]

  - name: ExposeAll a-la compiz scale/gnome overview/osx expose/skippy-xd.
    remap:
      Ctrl-t:
        remap:
          KEY_W:
            remap:
              KEY_W:
                launch: ["sudo", "-u", "danil", "-i", "/bin/sh", "-c", ". ~/.shrc && qdbus org.kde.kglobalaccel /component/kwin org.kde.kglobalaccel.Component.invokeShortcut 'ExposeAll'"]
              KEY_E:
                remap:
                  KEY_E:
                    launch: ["sudo", "-u", "danil", "-i", "/bin/sh", "-c", ". ~/.shrc && qdbus org.kde.kglobalaccel /component/kwin org.kde.kglobalaccel.Component.invokeShortcut 'Expose'"]
                  KEY_C:
                    launch: ["sudo", "-u", "danil", "-i", "/bin/sh", "-c", ". ~/.shrc && qdbus org.kde.kglobalaccel /component/kwin org.kde.kglobalaccel.Component.invokeShortcut 'ExposeClass'"]
          KEY_U:
            remap:
              KEY_W:
                remap:
                  KEY_W:
                    launch: ["sudo", "-u", "danil", "-i", "/bin/sh", "-c", ". ~/.shrc && qdbus org.kde.kglobalaccel /component/kwin org.kde.kglobalaccel.Component.invokeShortcut 'ExposeClassCurrentdesktop'"]

  - name: Window manager.
    remap:
      Ctrl-t:
        remap:
          KEY_W:
            remap:
              KEY_C:
                launch: ["sudo", "-u", "danil", "-i", "/bin/sh", "-c", ". ~/.shrc && wmctrl -c :ACTIVE:"]
              KEY_F:
                launch: ["sudo", "-u", "danil", "-i", "/bin/sh", "-c", ". ~/.shrc && wmctrl -r :ACTIVE: -b toggle,maximized_vert,maximized_horz"]
              KEY_M:
                launch: ["sudo", "-u", "danil", "-i", "/bin/sh", "-c", ". ~/.shrc && wmctrl -r :ACTIVE: -b toggle,maximized_vert,maximized_horz"]

  - name: Show desktop <http://ubuntuforums.org/showthread.php?t=1615199#td_post_10083165>.
    remap:
      Ctrl-t:
        remap:
          KEY_D: { launch: ["sudo", "-u", "danil", "-i", "/bin/sh", "-c", ". ~/.shrc && showdesktop.sh"] }

  - name: GNOME workspace.
    remap:
      Ctrl-t:
        remap:
          KEY_1: { launch: ["sudo", "-u", "danil", "-i", "/bin/sh", "-c", ". ~/.shrc && wmctrl -s 0"] }
          KEY_2: { launch: ["sudo", "-u", "danil", "-i", "/bin/sh", "-c", ". ~/.shrc && wmctrl -s 1"] }
          KEY_3: { launch: ["sudo", "-u", "danil", "-i", "/bin/sh", "-c", ". ~/.shrc && wmctrl -s 2"] }
          KEY_4: { launch: ["sudo", "-u", "danil", "-i", "/bin/sh", "-c", ". ~/.shrc && wmctrl -s 3"] }
          KEY_5: { launch: ["sudo", "-u", "danil", "-i", "/bin/sh", "-c", ". ~/.shrc && wmctrl -s 4"] }
          KEY_6: { launch: ["sudo", "-u", "danil", "-i", "/bin/sh", "-c", ". ~/.shrc && wmctrl -s 5"] }
          KEY_7: { launch: ["sudo", "-u", "danil", "-i", "/bin/sh", "-c", ". ~/.shrc && wmctrl -s 6"] }
          KEY_8: { launch: ["sudo", "-u", "danil", "-i", "/bin/sh", "-c", ". ~/.shrc && wmctrl -s 7"] }
          KEY_9: { launch: ["sudo", "-u", "danil", "-i", "/bin/sh", "-c", ". ~/.shrc && wmctrl -s 8"] }

  - name: GNOME move window to workspace.
    remap:
      Ctrl-t:
        remap:
          KEY_W:
            remap:
              KEY_1: { launch: ["sudo", "-u", "danil", "-i", "/bin/sh", "-c", ". ~/.shrc && wmctrl -r :ACTIVE: -t 0; wmctrl -s 0"] }
              KEY_2: { launch: ["sudo", "-u", "danil", "-i", "/bin/sh", "-c", ". ~/.shrc && wmctrl -r :ACTIVE: -t 1; wmctrl -s 1"] }
              KEY_3: { launch: ["sudo", "-u", "danil", "-i", "/bin/sh", "-c", ". ~/.shrc && wmctrl -r :ACTIVE: -t 2; wmctrl -s 2"] }
              KEY_4: { launch: ["sudo", "-u", "danil", "-i", "/bin/sh", "-c", ". ~/.shrc && wmctrl -r :ACTIVE: -t 3; wmctrl -s 3"] }
              KEY_5: { launch: ["sudo", "-u", "danil", "-i", "/bin/sh", "-c", ". ~/.shrc && wmctrl -r :ACTIVE: -t 4; wmctrl -s 4"] }
              KEY_6: { launch: ["sudo", "-u", "danil", "-i", "/bin/sh", "-c", ". ~/.shrc && wmctrl -r :ACTIVE: -t 5; wmctrl -s 5"] }
              KEY_7: { launch: ["sudo", "-u", "danil", "-i", "/bin/sh", "-c", ". ~/.shrc && wmctrl -r :ACTIVE: -t 6; wmctrl -s 6"] }
              KEY_8: { launch: ["sudo", "-u", "danil", "-i", "/bin/sh", "-c", ". ~/.shrc && wmctrl -r :ACTIVE: -t 7; wmctrl -s 7"] }
              KEY_9: { launch: ["sudo", "-u", "danil", "-i", "/bin/sh", "-c", ". ~/.shrc && wmctrl -r :ACTIVE: -t 8; wmctrl -s 8"] }
